name: 每周预告（下周财报 + 财经日历）

# 由 scheduler.py（在新闻循环里）按美东时间自动触发，也可以手动运行
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印不发送（1=是）"
        default: "0"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 安装浏览器和中文字体（用于截图和生成日历图）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - run: python -m jobs.weekly
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          WEBHOOK_CALENDAR: ${{ secrets.WEBHOOK_CALENDAR }}
