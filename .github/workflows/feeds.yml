name: 新闻与川普动态（约每分钟）

on:
  schedule:
    # 每 10 分钟启动一次；每次运行内部循环约 14 分钟、每 60 秒检查一次，
    # 运行之间会排队衔接，所以实际约每分钟刷新一次。
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印不发送（1=是）"
        default: "0"
      loop_minutes:
        description: "本次循环几分钟（测试时可填 0，只跑一轮）"
        default: "14"

permissions:
  contents: write

concurrency:
  group: state-json
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 循环检查突发新闻 / 川普 / 白宫
        run: python run_feeds.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '14' }}
          INTERVAL: "60"
          WEBHOOK_NEWS: ${{ secrets.WEBHOOK_NEWS }}
          WEBHOOK_TRUMP: ${{ secrets.WEBHOOK_TRUMP }}
          WEBHOOK_WHITEHOUSE: ${{ secrets.WEBHOOK_WHITEHOUSE }}
      - name: 保存去重记录
        if: ${{ always() && github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state [skip ci]" && git pull --rebase && git push)
