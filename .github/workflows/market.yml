name: 市场指标（恐惧贪婪指数 + Reddit 热度榜）

on:
  schedule:
    # 盘前：13:35 UTC = 美东 9:35（夏令时）/ 8:35（冬令时），只发恐惧贪婪指数
    - cron: "35 13 * * 1-5"
    # 收盘后：21:25 UTC = 美东 17:25（夏令时）/ 16:25（冬令时），恐惧贪婪指数 + 热度榜
    - cron: "25 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印不发送（1=是）"
        default: "0"
      mode:
        description: "fg=只发恐惧贪婪指数；close=恐惧贪婪指数+热度榜"
        default: "close"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 安装浏览器和中文字体（用于生成图片）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - run: python -m jobs.market
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          MARKET_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '35 13 * * 1-5' && 'fg' || 'close') }}
          WEBHOOK_MARKET: ${{ secrets.WEBHOOK_MARKET }}
