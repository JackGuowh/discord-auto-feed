name: 市场指标（恐惧贪婪指数 + Reddit 热度榜）

# 由 scheduler.py（在新闻循环里）按美东时间自动触发，也可以手动运行
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印不发送（1=是）"
        default: "0"
      mode:
        description: "fg=只发恐惧贪婪指数；close=恐惧贪婪指数+热度榜"
        default: "close"

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 安装浏览器和中文字体（用于生成图片）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - run: python -m jobs.market
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          FORCE: "0"
          MARKET_MODE: ${{ github.event.inputs.mode || 'close' }}
          WEBHOOK_MARKET: ${{ secrets.WEBHOOK_MARKET }}
