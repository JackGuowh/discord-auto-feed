name: 市场指标（交易日收盘后）

on:
  schedule:
    # 21:15 UTC = 美东夏令时 17:15 / 冬令时 16:15，周一到周五
    - cron: "15 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印不发送（1=是）"
        default: "0"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m jobs.market
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          WEBHOOK_MARKET: ${{ secrets.WEBHOOK_MARKET }}
